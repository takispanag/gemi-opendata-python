[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gemi-opendata-python"
version = "0.1.0"
description = "Python client for the official Greek GEMI Open Data API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Takis Panagiotopoulos" }]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.11,<1"]

[project.urls]
Repository = "https://github.com/takispanag/gemi-opendata-python"
Documentation = "https://github.com/takispanag/gemi-opendata-python/blob/main/docs/api.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gemi_opendata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

